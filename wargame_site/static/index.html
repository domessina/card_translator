<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éditeur d'image avec HTML</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.0/jszip.min.js"></script>
</head>
<body>
<div class="column">
    <input type="file" id="imageUpload" accept="image/*" multiple><br><br>
    <p id="gridCounter" style="font-size: 14px; color: #aaa;"></p>
    <div id="imageGrid"></div>
</div>
<div class="column">
    <p id="currentFilename" style="text-align: center; font-size: 14px; color: #aaa; margin: 6px 0;"></p>
    <div id="previewContainer">
        <div id="highlightBox">
            <div id="htmlPreview"></div>
        </div>
    </div>
    <div class="button-row">
        <button onclick="resetSelection()">♻️ Réinitialiser</button>
        <button onclick="downloadPreview()">💾 Télécharger</button>
    </div>
    <div class="button-row">
        <button onclick="saveAndNext()">📸 Valider</button>
    </div>
    <button class="download-all" onclick="downloadAllImages()">📥 Télécharger toutes les images</button>
    <div id="finalPreview" class="horizontal-strip"></div>
</div>
<div class="column">
    <label for="htmlRawBox">Résultat de l'OCR</label>
    <div id="htmlRawBox" contenteditable="true"></div>
    <label for="htmlUpload">Importer un html</label>
    <input type="file" id="htmlUpload" accept=".html" multiple><br><br>
    <fieldset id="colorFieldset">
        <legend>Couleur de fond</legend>
        <button onclick="activatePipette()">🧪</button>
        <div id="colorSample"></div>
        <label><input type="checkbox" id="roundedCorners"> Coins arrondis</label>
    </fieldset>
    <fieldset>
        <legend>Police</legend>
        <input type="file" id="fontUpload" accept=".ttf,.otf,.woff,.woff2">
        <div>
            <button id="fontDecrease">➖ Taille</button>
            <span id="fontSizeDisplay">14px</span>
            <button id="fontIncrease">➕ Taille</button>
        </div>
    </fieldset>
    <fieldset>
        <legend>Marge entre les paragraphes</legend>
        <button onclick="adjustParagraphMargin(-1)">➖ Marge</button>
        <button onclick="adjustParagraphMargin(1)">➕ Marge</button>
    </fieldset>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="js/textFit.js"></script>
<script src="js/state.js"></script>
<script src="js/margin.js"></script>
<script src="js/reset.js"></script>
<script src="js/imageManager.js"></script>
<script src="js/selection.js"></script>
<script src="js/export.js"></script>
<script src="js/translate.js"></script>
</body>
</html>
